name: MorphL
description: >-
  MorphL was an AI and machine learning platform for e-commerce and digital
  publishing personalization, offering a suite of API-based, fully-automated
  models that predicted user behaviors (shopping stage, churn, search intent)
  to power click-through, conversion, and personalization KPIs across the
  customer journey. Founded circa 2017 and funded through the Google Digital
  News Initiative, the European Data Incubator, and the Techstars Montreal AI
  accelerator, MorphL also shipped an open-source MorphL Community Edition
  (big-data + Spark/Cassandra ML pipeline). MorphL was acquired by Algolia in
  January 2021 to power Algolia's AI-driven predictive experiences and
  personalization. The company's product APIs and hosted developer surface are
  no longer operated as a standalone service; the morphl.ai and morphl.io
  domains no longer resolve. The archived open-source code remains public under
  the Morphl-AI GitHub organization.
